<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BizMind BD — Wireframes (ER-aligned)</title>
<style>
  :root{
    --brand:#1E6E8C; --brand-dark:#123E4F; --brand-light:#E4F1F5;
    --accent:#F2994A; --accent-light:#FDECD9;
    --line:#B9C4CC; --line-soft:#DCE3E8; --bg:#EEF3F5; --panel:#ffffff;
    --ink:#1F2A33; --muted:#66798A;
    --ok:#2E9E5B; --ok-light:#E4F5EB;
    --warn:#D98C1F; --warn-light:#FBEDD8;
    --danger:#D64545; --danger-light:#FBE4E4;
    --info:#2E6FBF; --info-light:#E4EDFA;
    --purple:#7A5FB0; --purple-light:#EEE9F7;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:var(--brand-dark);color:#fff;flex-wrap:wrap;gap:10px;}
  .topbar h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px;}
  .topbar .sub{font-size:11px;color:#B9D3DC;}
  .controls{display:flex;gap:8px;padding:14px 20px;flex-wrap:wrap;background:#DDEAEF;border-bottom:1px solid var(--line-soft);}
  .btn{border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:12px;cursor:pointer;border-radius:3px;color:var(--ink);}
  .btn.active{background:var(--brand);color:#fff;border-color:var(--brand);}
  .screen-tabs{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap;background:var(--bg);}
  .stage{padding:24px 20px 60px;display:flex;justify-content:center;}
  .frame{display:none;}
  .frame.show{display:block;}
  .er-note{max-width:960px;margin:0 auto 18px;font-size:11px;color:var(--muted);padding:0 4px;}

  .wf-box{border:1px solid var(--line-soft);background:var(--panel);}
  .wf-dash{border:1.5px dashed var(--brand);background:var(--brand-light);}
  .label{font-size:10px;color:var(--brand-dark);text-transform:uppercase;letter-spacing:.5px;position:relative;top:-1px;font-weight:bold;}
  .placeholder{color:var(--muted);font-size:11px;}
  .x-fill{background:repeating-linear-gradient(135deg,var(--brand-light),var(--brand-light) 8px,#dcecf1 8px,#dcecf1 16px);}

  /* ================= WEB FRAME ================= */
  .web-frame{width:1000px;max-width:100%;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 10px rgba(18,62,79,.08);}
  .web-chrome{height:26px;background:var(--brand-dark);border-bottom:1px solid var(--line-soft);display:flex;align-items:center;padding:0 10px;gap:5px;}
  .web-chrome span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.35);display:inline-block;}
  .web-body{display:flex;min-height:560px;}
  .web-sidebar{width:170px;background:var(--brand-dark);padding:14px 8px;flex-shrink:0;}
  .web-sidebar .brand{font-weight:bold;font-size:13px;color:#fff;border-bottom:1px solid rgba(255,255,255,.15);padding-bottom:10px;margin-bottom:12px;}
  .nav-item{border:1px solid transparent;padding:7px 8px;font-size:10.5px;margin-bottom:5px;color:#BFDCE6;}
  .nav-item.active{font-weight:bold;background:var(--brand);color:#fff;border-radius:3px;}
  .web-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .web-topbar{height:48px;border-bottom:1.5px solid var(--line-soft);background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px;}
  .web-content{padding:18px;flex:1;overflow:auto;}
  .search-box{border:1px solid var(--line-soft);background:var(--bg);padding:6px 10px;font-size:11px;color:var(--muted);width:220px;border-radius:3px;}
  .icon-circle{width:26px;height:26px;background:var(--brand-light);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--brand);}
  .row{display:flex;gap:14px;}
  .col{flex:1;min-width:0;}
  .kpi{border:1px solid var(--line-soft);border-left:4px solid var(--brand);background:#fff;padding:12px;text-align:left;border-radius:3px;}
  .kpi .num{font-size:18px;font-weight:bold;margin-top:6px;color:var(--brand-dark);}
  .chart-box{border:1px solid var(--line-soft);background:var(--brand-light);height:150px;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:11px;border-radius:3px;}
  .btn-solid{background:var(--accent);color:#fff;padding:7px 14px;font-size:11px;border:none;border-radius:3px;font-weight:bold;}
  .btn-outline{border:1px solid var(--line);background:#fff;padding:7px 14px;font-size:11px;border-radius:3px;color:var(--brand-dark);}
  table.wf-table{width:100%;border-collapse:collapse;font-size:10.5px;background:#fff;}
  table.wf-table th,table.wf-table td{border:1px solid var(--line-soft);padding:6px 7px;text-align:left;}
  table.wf-table th{background:var(--brand-light);font-weight:bold;color:var(--brand-dark);}
  .badge{border:1px solid var(--line-soft);padding:2px 8px;font-size:10px;display:inline-block;border-radius:10px;font-weight:bold;}
  .badge-ok{background:var(--ok-light);color:var(--ok);border-color:var(--ok-light);}
  .badge-low{background:var(--warn-light);color:var(--warn);border-color:var(--warn-light);}
  .badge-out{background:var(--danger-light);color:var(--danger);border-color:var(--danger-light);}
  .badge-pending{background:var(--info-light);color:var(--info);border-color:var(--info-light);}
  .badge-sent{background:var(--brand-light);color:var(--brand);border-color:var(--brand-light);}
  .badge-received{background:var(--ok-light);color:var(--ok);border-color:var(--ok-light);}
  .badge-hold{background:var(--warn-light);color:var(--warn);border-color:var(--warn-light);}
  .badge-active{background:var(--ok-light);color:var(--ok);border-color:var(--ok-light);}
  .badge-agent{background:var(--purple-light);color:var(--purple);border-color:var(--purple-light);}
  .chip{border:1px solid var(--line-soft);background:#fff;padding:4px 10px;font-size:10px;color:var(--muted);display:inline-block;margin-right:6px;border-radius:12px;}
  .chip.active{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:bold;}
  .mini-tabs{display:flex;gap:4px;margin-bottom:12px;}
  .mini-tab{padding:7px 12px;border:1px solid var(--line-soft);background:#fff;font-size:11px;color:var(--muted);}
  .mini-tab.active{border-bottom:2px solid var(--brand);font-weight:bold;color:var(--brand-dark);}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-light);border:1px solid var(--accent);}
  .rec-card{border:1px solid var(--line-soft);border-left:3px solid var(--purple);background:#fff;padding:8px 10px;font-size:10.5px;margin-bottom:8px;border-radius:4px;}

  /* AI chat */
  .chat-thread{display:flex;flex-direction:column;gap:10px;padding:6px 0;}
  .bubble{max-width:70%;padding:9px 12px;font-size:11px;border:1px solid var(--line-soft);border-radius:10px;}
  .bubble.user{align-self:flex-end;background:var(--brand);color:#fff;border-color:var(--brand);}
  .bubble.ai{align-self:flex-start;background:#fff;color:var(--ink);}
  .chat-input{border:1.5px solid var(--brand);background:#fff;border-radius:20px;display:flex;align-items:center;padding:8px 14px;gap:8px;margin-top:14px;}
  .chat-input .field{flex:1;color:var(--muted);font-size:11px;}
  .prompt-chip{border:1px dashed var(--brand);background:var(--brand-light);padding:6px 10px;font-size:10px;color:var(--brand-dark);display:inline-block;margin:0 6px 6px 0;border-radius:12px;}

  /* ================= MOBILE FRAME ================= */
  .mobile-frame{width:320px;border:2px solid var(--brand-dark);border-radius:22px;padding:8px;background:var(--panel);}
  .mobile-notch{width:70px;height:14px;background:var(--brand-dark);border-radius:8px;margin:0 auto 6px;}
  .mobile-screen{border:1px solid var(--line-soft);background:var(--bg);min-height:560px;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:14px;}
  .m-topbar{height:44px;background:var(--brand-dark);color:#fff;border-bottom:1.5px solid var(--brand-dark);display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px;flex-shrink:0;}
  .m-content{flex:1;padding:12px;overflow:auto;}
  .m-bottomnav{height:52px;background:#fff;border-top:1.5px solid var(--line-soft);display:flex;flex-shrink:0;}
  .m-nav-item{flex:1;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted);border-right:1px solid var(--line-soft);}
  .m-nav-item:last-child{border-right:none;}
  .m-nav-item.active{color:var(--brand);font-weight:bold;background:var(--brand-light);}
  .m-card{border:1px solid var(--line-soft);background:#fff;padding:10px;margin-bottom:8px;font-size:11px;border-radius:6px;border-left:3px solid var(--brand);}
  .m-kpi-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px;}
  .m-kpi{border:1px solid var(--line-soft);background:#fff;border-top:3px solid var(--brand);padding:8px;min-width:90px;font-size:10px;flex-shrink:0;border-radius:4px;}
  .fab{position:absolute;bottom:66px;right:14px;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;border:none;box-shadow:0 2px 6px rgba(242,153,74,.5);}
  .m-field{border:1px solid var(--line-soft);background:#fff;padding:9px 10px;font-size:11px;color:var(--muted);margin-bottom:10px;border-radius:4px;}
  .m-btn{background:var(--brand);color:#fff;padding:10px;text-align:center;font-size:11px;margin-bottom:10px;border-radius:4px;font-weight:bold;}
  .m-chip-row{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;}
  .m-chip{border:1px solid var(--line-soft);background:#fff;padding:5px 10px;font-size:10px;flex-shrink:0;color:var(--muted);border-radius:12px;}
  .m-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:bold;}
  .m-status{font-size:9px;border-radius:8px;padding:1px 7px;font-weight:bold;}
  .m-star{font-size:10px;color:var(--accent);}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <h1>BizMind BD — Wireframes</h1>
    <div class="sub">Aligned to ER schema: Users · Products/Inventory · Sales/Customers · Procurement · Suppliers · Expenses · AI recommendations/forecasts</div>
  </div>
  <div class="sub">Low-fidelity · layout reference</div>
</div>

<div class="controls">
  <button class="btn active" data-platform="web" onclick="setPlatform('web')">Web</button>
  <button class="btn" data-platform="mobile" onclick="setPlatform('mobile')">Mobile</button>
</div>

<div class="screen-tabs" id="screenTabs"></div>

<div class="stage" id="stage"></div>

<script>
const screens = ["Login","Dashboard","Inventory","Sales","Procurement","Supplier","Expenses","AI Assistant"];
let platform = "web";
let current = "Login";

function setPlatform(p){
  platform = p;
  document.querySelectorAll('[data-platform]').forEach(b=>b.classList.toggle('active', b.dataset.platform===p));
  render();
}
function setScreen(s){
  current = s;
  render();
}
function buildTabs(){
  const tabs = document.getElementById('screenTabs');
  tabs.innerHTML = screens.map(s=>`<button class="btn" data-screen="${s}" onclick="setScreen('${s}')">${s}</button>`).join('');
}

/* full module list drives the web sidebar (maps to ER entities) */
const webNavItems = ["Dashboard","Inventory","Sales","Procurement","Supplier","Expenses","AI Assistant"];
function webNavHtml(activeLabel){
  return webNavItems.map(i=>`<div class="nav-item ${i===activeLabel?'active':''}">${i}</div>`).join('');
}

/* condensed 5-slot bottom nav for mobile; secondary modules roll into "More" */
const mobilePrimary = {"Dashboard":"Home","Inventory":"Stock","Sales":"Sales","Procurement":"Orders"};
const mobileMoreGroup = ["Supplier","Expenses","AI Assistant"];
function mobileNavHtml(activeLabel){
  const items = ["Home","Stock","Sales","Orders","More"];
  return items.map(i=>{
    const isActive = (mobilePrimary[activeLabel]===i) || (i==="More" && mobileMoreGroup.includes(activeLabel));
    return `<div class="m-nav-item ${isActive?'active':''}">${i}</div>`;
  }).join('');
}

/* ---------- WEB SCREENS ---------- */
function webShell(activeLabel, topbarRight, contentHtml){
  return `
  <div class="web-frame">
    <div class="web-chrome"><span></span><span></span><span></span></div>
    <div class="web-body">
      <div class="web-sidebar">
        <div class="brand">BizMind BD</div>
        ${webNavHtml(activeLabel)}
      </div>
      <div class="web-main">
        <div class="web-topbar">
          <div class="search-box">Search products, POs, suppliers, sales...</div>
          <div style="display:flex;gap:10px;align-items:center;">${topbarRight}<div class="icon-circle">N</div><div class="avatar wf-box"></div></div>
        </div>
        <div class="web-content">${contentHtml}</div>
      </div>
    </div>
  </div>`;
}

function webLogin(){
  return `
  <div class="web-frame">
    <div class="web-chrome"><span></span><span></span><span></span></div>
    <div class="web-body" style="min-height:520px;">
      <div class="col wf-dash x-fill" style="display:flex;align-items:center;justify-content:center;">
        <div class="placeholder">Brand illustration / value prop panel</div>
      </div>
      <div class="col" style="display:flex;align-items:center;justify-content:center;">
        <div style="width:280px;">
          <div style="font-weight:bold;font-size:16px;margin-bottom:4px;color:var(--brand-dark);">BizMind BD</div>
          <div class="label" style="margin-bottom:18px;">Sign in to your account</div>
          <div class="m-field">Email address</div>
          <div class="m-field">Password</div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:14px;">
            <span>[ ] Remember me</span><span style="color:var(--brand);">Forgot password?</span>
          </div>
          <div class="m-btn">Log in</div>
          <div style="text-align:center;font-size:10px;color:var(--muted);margin-bottom:10px;">or continue with</div>
          <div style="display:flex;gap:8px;">
            <div class="btn-outline" style="flex:1;text-align:center;">Google</div>
            <div class="btn-outline" style="flex:1;text-align:center;">EN / BN</div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function webDashboard(){
  const kpis = ["Revenue this month","Total expenses","Low stock items","Pending POs"];
  const content = `
    <div class="row" style="margin-bottom:14px;">
      ${kpis.map(k=>`<div class="col kpi"><div class="label">${k}</div><div class="num">--</div></div>`).join('')}
    </div>
    <div class="row" style="margin-bottom:14px;">
      <div class="col"><div class="label" style="margin-bottom:6px;">Revenue vs expenses (30 days)</div><div class="chart-box">Line chart placeholder</div></div>
      <div class="col"><div class="label" style="margin-bottom:6px;">Stock trend by category</div><div class="chart-box">Bar chart placeholder</div></div>
    </div>
    <div class="row">
      <div class="col" style="flex:2;">
        <div class="label" style="margin-bottom:6px;">Recent activity</div>
        <table class="wf-table">
          <tr><th>Date</th><th>Event</th><th>Module</th><th>Status</th></tr>
          <tr><td>--</td><td>Sale recorded — product x qty</td><td>Sales</td><td><span class="badge badge-ok">Done</span></td></tr>
          <tr><td>--</td><td>PO #0192 created</td><td>Procurement</td><td><span class="badge badge-pending">Pending</span></td></tr>
          <tr><td>--</td><td>Product below reorder_level</td><td>Inventory</td><td><span class="badge badge-low">Alert</span></td></tr>
          <tr><td>--</td><td>Expense logged — category</td><td>Expenses</td><td><span class="badge badge-ok">Done</span></td></tr>
        </table>
      </div>
      <div class="col">
        <div class="label" style="margin-bottom:6px;">AI recommendations</div>
        <div class="rec-card"><span class="badge badge-agent">restock_agent</span><br>"Reorder product before Friday — demand forecast rising."</div>
        <div class="rec-card"><span class="badge badge-agent">pricing_agent</span><br>"Supplier B offers lower unit_cost this cycle."</div>
        <div class="label" style="margin:10px 0 6px;">Notifications</div>
        <div class="placeholder">3 unread — low stock, PO approval, forecast ready</div>
      </div>
    </div>`;
  return webShell("Dashboard", `<div class="btn-outline">This month ▾</div>`, content);
}

function webInventory(){
  const content = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div>
        <span class="chip active">All</span><span class="chip">In stock</span><span class="chip">Low stock</span><span class="chip">Out of stock</span>
      </div>
      <div class="btn-solid">+ Add product</div>
    </div>
    <table class="wf-table">
      <tr><th>SKU</th><th>Name</th><th>Category</th><th>Unit price</th><th>Qty on hand</th><th>Reorder level</th><th>Warehouse</th><th>Status</th><th>Actions</th></tr>
      <tr><td>BM-001</td><td>Product name</td><td>Category</td><td>৳ --</td><td>120</td><td>50</td><td>Dhaka WH-1</td><td><span class="badge badge-ok">OK</span></td><td>Edit</td></tr>
      <tr><td>BM-002</td><td>Product name</td><td>Category</td><td>৳ --</td><td>18</td><td>30</td><td>Ctg WH-2</td><td><span class="badge badge-low">Low</span></td><td>Edit</td></tr>
      <tr><td>BM-003</td><td>Product name</td><td>Category</td><td>৳ --</td><td>0</td><td>20</td><td>Dhaka WH-1</td><td><span class="badge badge-out">Out</span></td><td>Edit</td></tr>
      <tr><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td></tr>
    </table>
    <div style="margin-top:10px;font-size:10px;color:var(--muted);">products table · showing 1-3 of 240 · ‹ 1 2 3 ... 40 ›</div>`;
  return webShell("Inventory", `<div class="btn-outline">Export</div>`, content);
}

function webSales(){
  const kpis = ["Today's sales","This month revenue","Transactions"];
  const content = `
    <div class="row" style="margin-bottom:14px;">
      ${kpis.map(k=>`<div class="col kpi"><div class="label">${k}</div><div class="num">--</div></div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div><span class="chip active">All</span><span class="chip">Today</span><span class="chip">This week</span><span class="chip">This month</span></div>
      <div class="btn-solid">+ New sale</div>
    </div>
    <table class="wf-table">
      <tr><th>Date</th><th>Customer</th><th>Product</th><th>Qty</th><th>Unit price</th><th>Total amount</th><th>Recorded by</th></tr>
      <tr><td>--</td><td>Customer name</td><td>Product name</td><td>3</td><td>৳ --</td><td>৳ --</td><td>User name</td></tr>
      <tr><td>--</td><td>Customer name</td><td>Product name</td><td>1</td><td>৳ --</td><td>৳ --</td><td>User name</td></tr>
      <tr><td>--</td><td>Customer name</td><td>Product name</td><td>5</td><td>৳ --</td><td>৳ --</td><td>User name</td></tr>
    </table>
    <div style="margin-top:10px;font-size:10px;color:var(--muted);">sales table, joined with customers + products</div>`;
  return webShell("Sales", `<div class="btn-outline">Export</div>`, content);
}

function webProcurement(){
  const content = `
    <div class="mini-tabs">
      <div class="mini-tab active">Purchase orders</div>
      <div class="mini-tab">Requests</div>
      <div class="mini-tab">Approvals</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div><span class="chip active">All</span><span class="chip">Draft</span><span class="chip">Sent</span><span class="chip">Received</span></div>
      <div class="btn-solid">+ New purchase order</div>
    </div>
    <div class="row">
      <div class="col" style="flex:2;">
        <table class="wf-table">
          <tr><th>PO #</th><th>Supplier</th><th>Order date</th><th>Total cost</th><th>Status</th><th>Actions</th></tr>
          <tr><td>PO-1042</td><td>Supplier name</td><td>--</td><td>৳ --</td><td><span class="badge badge-pending">Pending</span></td><td>View items</td></tr>
          <tr><td>PO-1041</td><td>Supplier name</td><td>--</td><td>৳ --</td><td><span class="badge badge-sent">Sent</span></td><td>View items</td></tr>
          <tr><td>PO-1040</td><td>Supplier name</td><td>--</td><td>৳ --</td><td><span class="badge badge-received">Received</span></td><td>View items</td></tr>
        </table>
      </div>
      <div class="col wf-dash" style="padding:12px;">
        <div class="label" style="margin-bottom:8px;">PO-1042 items (po_items)</div>
        <table class="wf-table" style="background:transparent;">
          <tr><th>Product</th><th>Qty</th><th>Unit cost</th></tr>
          <tr><td>Product A</td><td>50</td><td>৳ --</td></tr>
          <tr><td>Product B</td><td>20</td><td>৳ --</td></tr>
        </table>
        <div class="placeholder" style="margin-top:8px;">Generated from AI recommendation ↗</div>
      </div>
    </div>`;
  return webShell("Procurement", `<div class="btn-outline">Filter</div>`, content);
}

function webSupplier(){
  const content = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="search-box" style="width:260px;">Search suppliers...</div>
      <div class="btn-solid">+ Add supplier</div>
    </div>
    <div class="row">
      <div class="col" style="flex:2;">
        <table class="wf-table">
          <tr><th>Supplier</th><th>Contact info</th><th>Address</th><th>Rating</th><th>Status</th></tr>
