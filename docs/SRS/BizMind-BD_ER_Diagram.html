<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;">Complete entity relationship diagram for the BizMind BD SME commerce, procurement and business intelligence platform</h2>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const src = `erDiagram
  BUSINESSES ||--o{ USERS : employs
  BUSINESSES ||--o{ PRODUCTS : owns
  BUSINESSES ||--o{ CUSTOMERS : has
  BUSINESSES ||--o{ SUPPLIERS : has
  BUSINESSES ||--o{ EXPENSES : incurs
  BUSINESSES ||--o{ AI_RECOMMENDATIONS : receives
  USERS ||--o{ SALES : records
  USERS ||--o{ PURCHASE_ORDERS : creates
  USERS ||--o{ EXPENSES : logs
  USERS ||--o{ NOTIFICATIONS : receives
  PRODUCTS ||--o{ SALES : "sold in"
  PRODUCTS ||--o| INVENTORY : "tracked in"
  PRODUCTS ||--o{ PO_ITEMS : "ordered in"
  PRODUCTS ||--o{ DEMAND_FORECASTS : "forecasted for"
  CUSTOMERS ||--o{ SALES : makes
  SUPPLIERS ||--o{ PURCHASE_ORDERS : fulfills
  PURCHASE_ORDERS ||--o{ PO_ITEMS : contains
  PURCHASE_ORDERS ||--o| AI_RECOMMENDATIONS : "generated from"
  DEMAND_FORECASTS ||--o| AI_RECOMMENDATIONS : informs

  BUSINESSES {
    uuid id PK
    string name
    string industry
    string address
    uuid owner_id FK
  }
  USERS {
    uuid id PK
    uuid business_id FK
    string name
    string email
    string password_hash
    string role
  }
  PRODUCTS {
    uuid id PK
    uuid business_id FK
    string name
    string sku
    string category
    decimal unit_price
    int reorder_level
  }
  INVENTORY {
    uuid id PK
    uuid product_id FK
    int quantity_on_hand
    string warehouse_location
    timestamp last_updated
  }
  CUSTOMERS {
    uuid id PK
    uuid business_id FK
    string name
    string contact_info
    string address
  }
  SALES {
    uuid id PK
    uuid product_id FK
    uuid customer_id FK
    uuid user_id FK
    int quantity
    date sale_date
    decimal total_amount
  }
  SUPPLIERS {
    uuid id PK
    uuid business_id FK
    string name
    string contact_info
    string address
    decimal rating
  }
  PURCHASE_ORDERS {
    uuid id PK
    uuid supplier_id FK
    uuid user_id FK
    date order_date
    string status
    decimal total_cost
  }
  PO_ITEMS {
    uuid id PK
    uuid po_id FK
    uuid product_id FK
    int quantity
    decimal unit_cost
  }
  EXPENSES {
    uuid id PK
    uuid business_id FK
    uuid user_id FK
    string category
    decimal amount
    date date
    string description
  }
  DEMAND_FORECASTS {
    uuid id PK
    uuid product_id FK
    date forecast_date
    int predicted_quantity
    decimal confidence_score
    timestamp generated_at
  }
  AI_RECOMMENDATIONS {
    uuid id PK
    uuid business_id FK
    string agent_type
    string recommendation_text
    string status
    timestamp created_at
  }
  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    string message
    string type
    boolean is_read
    timestamp created_at
  }
`;
const { svg } = await mermaid.render('erd-svg', src);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
