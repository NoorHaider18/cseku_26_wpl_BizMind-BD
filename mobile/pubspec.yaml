name: bizmind_bd
description: BizMind BD mobile app — inventory, sales, procurement, and AI assistant for SMEs.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0        # navigation / routing
  http: ^1.2.2               # API calls to the NestJS backend
  flutter_secure_storage: ^9.2.2  # auth token storage
  provider: ^6.1.2           # state management (swap for riverpod/bloc if team prefers)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
